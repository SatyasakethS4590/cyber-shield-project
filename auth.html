<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield - Login & Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #0d1b2a;
      border: 1px solid #1d3b55;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #00e5ff;
    }

    .subtitle {
      text-align: center;
      color: #9fb3c8;
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #c9d7e5;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #31506b;
      background: #081522;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #00bcd4;
      color: #001018;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #9fb3c8;
    }

    .switch a {
      color: #00e5ff;
      cursor: pointer;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      min-height: 22px;
      color: #9fb3c8;
    }

    .hidden {
      display: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9fb3c8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Cyber<span>Shield</span></div>
    <div class="subtitle">Cybersecurity Learning Platform</div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>Welcome Back</h2>

      <label for="loginEmail">Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
      >

      <label for="loginPassword">Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
      >

      <button onclick="login()">Login</button>

      <div class="message" id="loginMessage"></div>

      <div class="switch">
        Don't have an account?
        <a onclick="showRegister()">Create Account</a>
      </div>

    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="hidden">

      <h2>Create Account</h2>

      <label for="registerName">Full Name</label>
      <input
        type="text"
        id="registerName"
        placeholder="Enter your name"
      >

      <label for="registerEmail">Email</label>
      <input
        type="email"
        id="registerEmail"
        placeholder="Enter your email"
      >

      <label for="registerPassword">Password</label>
      <input
        type="password"
        id="registerPassword"
        placeholder="Create a password"
      >

      <button onclick="register()">Create Account</button>

      <div class="message" id="registerMessage"></div>

      <div class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </div>

    </div>

    <a class="back" href="index.html">← Back to CyberShield</a>

  </div>


  <!-- Supabase -->
  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    /*
      =====================================================
      CYBERSHIELD SUPABASE CONFIGURATION
      =====================================================

      Replace ONLY these two values:

      1. YOUR_PROJECT_URL
      2. YOUR_PUBLISHABLE_KEY

      Do NOT put your database password here.
      Do NOT put a secret/service_role key here.
    */

    const SUPABASE_URL = "https://satyasakeths4590.github.io/cyber-shield-project/";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Jl1vqEQhCIY5XrBXh6I-gw_MO_CeIGt";

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // -----------------------------
    // SHOW REGISTER
    // -----------------------------

    window.showRegister = function () {

      document
        .getElementById("loginBox")
        .classList.add("hidden");

      document
        .getElementById("registerBox")
        .classList.remove("hidden");

    };


    // -----------------------------
    // SHOW LOGIN
    // -----------------------------

    window.showLogin = function () {

      document
        .getElementById("registerBox")
        .classList.add("hidden");

      document
        .getElementById("loginBox")
        .classList.remove("hidden");

    };


    // -----------------------------
    // REGISTER
    // -----------------------------

    window.register = async function () {

      const name =
        document.getElementById("registerName").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;

      const message =
        document.getElementById("registerMessage");


      if (!name || !email || !password) {

        message.textContent =
          "Please fill in all fields.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      message.textContent =
        "Creating your account...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            },

            emailRedirectTo:
              "https://satyasakeths4590.github.io/cyber-shield-project/"

          }

        });


      if (error) {

        message.textContent =
          error.message;

        return;
      }


      if (data.user) {

        message.textContent =
          "Account created! Check your email if confirmation is required.";

      }

    };


    // -----------------------------
    // LOGIN
    // -----------------------------

    window.login = async function () {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      const message =
        document.getElementById("loginMessage");


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      message.textContent =
        "Signing in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        message.textContent =
          error.message;

        return;
      }


      if (data.session) {

        message.textContent =
          "Login successful!";

        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 800);

      }

    };

  </script>

</body>
</html>
